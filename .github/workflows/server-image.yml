name: Server image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read
  # Publishes the image to ghcr.io after the image check passes; never from pull requests.
  packages: write

concurrency:
  group: server-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          platforms: linux/amd64
          tags: buncrawl-server:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The runtime image plus the renderer sources; reuses the layers built above.
      - name: Build the image-check target
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          target: image-check
          platforms: linux/amd64
          tags: buncrawl-server:ci-image-check
          load: true
          cache-from: type=gha

      # Real Lightpanda and Chrome renders of a local fixture, then /v1/capabilities from the
      # running server; nothing here reaches the public internet.
      - name: Check the image
        run: apps/server/scripts/check-image.sh buncrawl-server:ci buncrawl-server:ci-image-check

      # ghcr.io/<owner>/<repo>: `main` and `sha-<commit>` from main; `<version>`, `<major>.<minor>`
      # and `latest` from v* tags.
      - name: Image tags
        if: github.event_name == 'push'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Log in to ghcr.io
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Rebuilds from the cache populated above, so this only uploads the tested layers.
      - name: Publish the image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
